<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Unit Converter</title>
</head>
<body>

    <main>
        <!--App Header-->
        <section class="app-container" id="conversion-header">
            <!--Header container-->
            <section id="header-container">
                <div id="my-profile">
                    <img src="./my image .jpg" alt="My Profile Picture" id="profile-picture">
                    <p id="profile-name">Luis Eichie</p>
                </div>
                <p id="app-title">Metric Unit Converter</p>
            </section>

           <!--Divider-->
            <div class="app-container" id="divider">

            </div>

            <!--Conversion Section-->
            <section id="conversion-items">

                <!--Top Result-->
                <div class="result-container" id="top-result">
                    <p class="label" id="top-label">Meter</p>
                    <div class="result" id="top-result-value">
                        <output class="output-num" id="top-output">0.00</output>
                        <p class="unit" id="top-unit">m</p>
                    </div>
                </div>

                <!--Bottom Result-->
                <div class="result-container" id="bottom-result">
                    <p class="label" id="bottom-label">Feet</p>
                    <div class="result" id="bottom-result-value">
                        <output class="output-num" id="bottom-output">0.00</output>
                        <p class="unit" id="bottom-unit">ft</p>
                    </div>
                </div>
            </section>

        </section>


        <!--Divider-->
        <div class="app-container" id="divider">
        </div>

        <!--App Body-->
        <section class="app-container" id="conversion-body">

             <!--Input Section-->
            <section id="input-section">

                <!--User Input-->
                <input id="enter-value" type="number" placeholder="Enter value">
    
                <!--Metric Control-->
                <section id="metric-tabs">
                    <p class="label">Metric</p>
                    <section id="button-tabs">
                         <div class="active-indicator"></div>
                        <button class="metric-control active" id="length" type="button">length</button>

                        <button class="metric-control" id="volume" type="button">volume</button>

                        <button class="metric-control" id="mass" type="button">mass</button>
                    </section>
                </section>

            </section>

             <!--Call to Action-->
             <button id="convert" type="button">Convert</button>

            
        </section>
    </main>
    
    <script src="index.js"></script>
</body>
</html>
